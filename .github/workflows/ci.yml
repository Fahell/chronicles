name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rpg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: rpg/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (Biome)
        run: pnpm lint

      - name: Unit + integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # E2E in CI is limited to the build-artifact gate (no browser): the
      # full e2e tier runs locally via the Chrome DevTools MCP (tech-spec §8.2).
      - name: Verify build artifact (e2e gate)
        run: pnpm test:e2e

      - name: Upload rpg/build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpg-build
          path: rpg/build
          if-no-files-found: error
